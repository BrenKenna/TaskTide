site_name: TaskTide Documentation
site_description: Java Workflow Orchestration Engine for Data Application deployments
site_author: Brendan Kenna

site_url:  https://docs.tasktide.org
repo_url:  https://github.com/BrenKenna/TaskTide
repo_name: BrenKenna/TaskTide
edit_uri:  edit/main/

docs_dir:  docs

theme:
  name: material

  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

  icon:
    repo: fontawesome/brands/github

  language: en

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true

  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.smartsymbols
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist
  - pymdownx.tilde

plugins:
  - search

nav:
  - Home:                           index.md

  - Guides:
    - Installation:                 Install.md
    - Database Configuration:       Database-Driver-Installation.md
    - Frequently Asked Questions:   FAQ.md

  - Modules:
      - Modules:                    tasktide/README.md
      - Mutex:                      tasktide/mutex/README.md
      - Item Store:                 tasktide/itemstore/README.md
      - Core:                       tasktide/core/README.md
      - Engine:                     tasktide/engine/README.md
      - Web API:                    tasktide/api/README.md
      - Parser:                     tasktide/parser/README.md
      - TaskTide:                   tasktide/tasktide/README.md

  - Use Cases:
      - Introduction:               tasktide/use-cases/README.md
      - Workflows:                  tasktide/use-cases/workflow-use-case/README.md
      - Task Binding:               tasktide/use-cases/task-binding-use-case/README.md
      - AI Deployment:              tasktide/use-cases/deployment-use-case/README.md

  - API Reference:
      - JavaDoc:                    javadocs/index.html

  - Changelog:
      - v1.0.0:                     https://github.com/BrenKenna/TaskTide/blob/main/tasktide/CHANGELOG.adoc