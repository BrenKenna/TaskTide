######################################################
######################################################
# 
# 1). TaskTide Global Configurations
# 
######################################################
######################################################


# Collection Paramenters
tasktide.core.collection.workflow.name=profiled-workflow
tasktide.core.collection.step.name=profiled-step
tasktide.core.collection.workitem.name=profiled-work-item


# Repository parameters
tasktide.core.repository.type=rocksdb
tasktide.core.repository.file-path=myData


# Jakarta NoSQL parameters
tasktide.core.repository.jnosql.type=document
tasktide.core.repository.jnosql.provider=couchDB
tasktide.core.repository.jnosql.provider-class=org.eclipse.jnosql.databases.couchdb.communication.CouchDBDocumentConfiguration
tasktide.core.repository.jnosql.user=admin
tasktide.core.repository.jnosql.password=password
tasktide.core.repository.jnosql.host=localhost:59484


# Utility parameters
tasktide.utils.date-format=dd/MM/yy HH:mm:ss
tasktide.utils.token-expiration-days=4


######################################################
######################################################
# 
# 2). TaskTide Manager Configurations
# 
######################################################
######################################################


# Collection Paramenters
tasktide.manager.inputFile=manager-input-file
tasktide.manager.outputFile=manager-output-file
tasktide.manager.delimiter=manager-delimiter
tasktide.manager.nestedDelimiter=manager-nested-delimiter



######################################################
######################################################
# 
# 3). TaskTide Engine Configurations
# 
######################################################
######################################################


# Task Tide Engine Parameters
tasktide.engine.worker.lock-wait-time=4
tasktide.engine.worker.processor.threads.workitem=2
tasktide.engine.worker.processor.thresholds.workitem=2

tasktide.engine.worker.processor.threads.itemtask=2
tasktide.engine.worker.processor.thresholds.itemtask=2