# Set the document provider to CouchDB <- Works Fine
jnosql.document.provider=org.eclipse.jnosql.databases.couchdb.communication.CouchDBDocumentConfiguration
jnosql.document.database=tasktide_database
jnosql.couchdb.host=localhost
jnosql.couchdb.username=admin
jnosql.couchdb.password=password
jnosql.couchdb.port=5984

tasktide.manager.method=SUMMARIZE
tasktide.manager.targetStep=Nested NS Lookups
tasktide.manager.target=WorkItem


# Base web service settings
tasktide.web-api.host=http://localhost
tasktide.web-api.port=8080
tasktide.web-api.base-path=/tasktide