apply plugin: 'maven-publish'
apply plugin: 'signing'
apply plugin: 'org.danilopianini.publish-on-central'
apply from: "$rootDir/gradle/pom.gradle"

group = 'org.tasktide'

publishing {
    publications {
        mavenAggregator(MavenPublication) {
            pom {
                name = 'TaskTide'
                description = 'TaskTide libraries'
                packaging = 'pom'

                configureTaskTidePom.delegate = delegate
                configureTaskTidePom.resolveStrategy = Closure.DELEGATE_FIRST
                configureTaskTidePom()

                withXml {
                    def dependenciesNode = asNode().appendNode('dependencies')

                    [
                        project(':api'),
                        project(':engine'),
                        project(':core'),
                        project(':itemstore'),
                        project(':parser'),
                        project(':mutex')
                    ].each { dependencyProject ->
                        def dependency = dependenciesNode.appendNode('dependency')

                        dependency.appendNode('groupId', dependencyProject.group)
                        dependency.appendNode(
                            'artifactId',
                            "${dependencyProject.name}"
                        )
                        dependency.appendNode(
                            'version',
                            dependencyProject.version
                        )
                    }
                }
            }
        }
    }
}


def signingKeyFile = rootProject.file(
    findProperty('signingKeyFile')
)

def signingPassword = findProperty('signingPassword')

if (!signingKeyFile.exists()) {
    throw new GradleException(
        "GPG signing key not found: $signingKeyFile"
    )
}

if (!signingPassword) {
    throw new GradleException(
        "GPG signing password has not been configured"
    )
}

def signingExtension = project.extensions.getByType(
    org.gradle.plugins.signing.SigningExtension
)

signingExtension.useInMemoryPgpKeys(
    signingKeyFile.text,
    signingPassword
)

signingExtension.sign(
    publishing.publications.mavenAggregator
)