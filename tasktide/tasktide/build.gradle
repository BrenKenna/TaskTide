plugins {
    id 'java'
    id 'application'
}

description = 'tasktide:tasktide'
group = 'org.tasktide.tasktide'
version = '0.9.0'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

application {
    mainClass = 'org.tasktide.tasktide.TaskTide'
}


// Embeds Weld and Quarkus runtimes
configurations.all {
    resolutionStrategy {
        force 'org.jboss.logging:jboss-logging:3.6.0.Final'
    }
}

configurations {
    weldRuntime
    quarkusRuntime
}

dependencies {

    // Project core lib
    implementation  project(':itemstore')
    implementation  project(':core')
    implementation  project(':engine')

    // Command-line argument parser
    implementation  'info.picocli:picocli:4.7.7'

    // Jakarta-NoSQL
    implementation  'jakarta.nosql:jakarta.nosql-api:1.0.0'
    implementation  "org.eclipse.jnosql.mapping:jnosql-mapping-document:1.1.8"
    implementation  "org.eclipse.jnosql.mapping:jnosql-mapping-key-value:1.1.8"
    implementation  "org.eclipse.jnosql.mapping:jnosql-mapping-column:1.1.8"
    implementation  "org.eclipse.jnosql.mapping:jnosql-mapping-graph:1.1.8"

    // Jakarta-NoSQL Database Drivers
    implementation "org.eclipse.jnosql.databases:jnosql-mongodb:1.1.6"
    implementation "org.eclipse.jnosql.databases:jnosql-couchdb:1.1.6"
    implementation "org.eclipse.jnosql.databases:jnosql-arangodb:1.1.6"
    implementation "org.eclipse.jnosql.databases:jnosql-dynamodb:1.1.6"
    implementation "org.eclipse.jnosql.databases:jnosql-couchbase:1.1.6"
    implementation "org.eclipse.jnosql.databases:jnosql-redis:1.1.6"
    implementation "org.eclipse.jnosql.databases:jnosql-cassandra:1.1.6"

    // CDI Provider
    implementation      'org.jboss.weld.se:weld-se-core:5.1.2.Final'
    implementation      'org.jboss.logging:jboss-logging:3.6.0.Final'
    implementation      'io.quarkus.arc:arc:3.11.1'
    implementation      'io.smallrye.config:smallrye-config:3.13.2'

    // JPA
    implementation      "jakarta.persistence:jakarta.persistence-api:3.1.0"
    implementation      "org.hibernate.orm:hibernate-core:6.4.4.Final"
    implementation      "com.zaxxer:HikariCP:5.1.0"
    implementation      'mysql:mysql-connector-java:8.0.33'
}

// Slim jar no dependancies or CDI runtime
jar {
    archiveBaseName.set("tasktide-${project.name}")
    archiveVersion.set(version)
}


// Copy the resources into a config folder within zip
distributions {
    main {
        contents {
            from(sourceSets.main.resources) {
                into "config"
            }
        }
    }
}


// Adjust startup scripts to use this config folder
tasks.named('startScripts').configure {
    doLast {
        unixScript.text = unixScript.text.replaceFirst(
            /(?m)^CLASSPATH=.*$/,
            'CLASSPATH=\\$APP_HOME/config:\\$APP_HOME/lib/*'
        )

        windowsScript.text = windowsScript.text.replaceFirst(
            /(?m)^set CLASSPATH=.*$/,
            'set CLASSPATH=%APP_HOME%\\config;%APP_HOME%\\lib\\*'
        )
    }
}


// Testing single task imports
tasks.register('singleTaskImport', JavaExec) {
    group = 'application'
    description = 'Import single tasks'
    classpath = sourceSets.main.runtimeClasspath
    mainClass.set('org.tasktide.tasktide.TaskTide')
    
    args = [
            "manager",
            "--repository-type", "sql",
            "--target-file", "src/test/resources/singleTaskImports.txt",
            "--method", "import",
            "--delimiter", "|",
            "--target", "WORKITEM"
    ]
}


// Import json tasks for annotation
tasks.register('jsonImport', JavaExec) {
    group = 'application'
    description = 'Import JSON tasks'
    classpath = sourceSets.main.runtimeClasspath
    mainClass.set('org.tasktide.tasktide.TaskTide')
    
    args = [
            "manager",
            "--repository-type", "sql",
            "--target-file", "src/test/resources/import-docs.json",
            "--method", "import",
            "--delimiter", "JSON",
            "--target", "WORKITEM"
    ]
}


// Testing annotations
tasks.register('annotations', JavaExec) {
    dependsOn(tasks.named("jsonImport"))
    group = 'application'
    description = 'Annotating collection'
    classpath = sourceSets.main.runtimeClasspath
    mainClass.set('org.tasktide.tasktide.TaskTide')
    
    args = [
            "manager",
            "--repository-type", "sql",
            "--method", "Annotation",
            "--import-string", """{""Pilot Label"": ""Gradle Build""}""",
            "--target-file", "src/test/resources/forAnno.txt",
            "--delimiter", ",",
            "--target", "WORKITEM"
    ]
}


// Test batch execution
tasks.register('pilotLabelExecution', JavaExec) {
    dependsOn(tasks.named("annotations"))
    group = 'application'
    description = 'Run engine in batch mode using pilot label'
    classpath = sourceSets.main.runtimeClasspath
    mainClass.set('org.tasktide.tasktide.TaskTide')
    
    args = [
            "engine",
            "--repository-type", "sql",
            "--step-name", "SequenceAlignment",
            "--pilot-label-key", "Pilot Label",
            "--pilot-label-value", "Gradle Build",
            "--execution-policy", "batch"
    ]
}