plugins {
    id 'java'
}

description = 'tasktide:core'
version = providers.gradleProperty('coreVersion').get()


dependencies {

    // TaskTide ItemStore Lib
    implementation          project(':mutex')
    implementation          project(':itemstore')

    // Jakarta-NoSQL
    implementation          'jakarta.nosql:jakarta.nosql-api:1.0.1'
    implementation          "org.eclipse.jnosql.mapping:jnosql-mapping-document:1.1.17"
    implementation          "org.eclipse.jnosql.mapping:jnosql-mapping-key-value:1.1.17"
    implementation          "org.eclipse.jnosql.mapping:jnosql-mapping-column:1.1.17"
    implementation          "org.eclipse.jnosql.mapping:jnosql-mapping-graph:1.1.17"

    // Jakarta-NoSQL Database Drivers
    implementation          "org.eclipse.jnosql.databases:jnosql-mongodb:1.1.18"
    implementation          "org.eclipse.jnosql.databases:jnosql-couchdb:1.1.18"
    implementation          "org.eclipse.jnosql.databases:jnosql-arangodb:1.1.18"
    implementation          "org.eclipse.jnosql.databases:jnosql-dynamodb:1.1.18"
    implementation          "org.eclipse.jnosql.databases:jnosql-couchbase:1.1.18"
    implementation          "org.eclipse.jnosql.databases:jnosql-redis:1.1.18"
    implementation          "org.eclipse.jnosql.databases:jnosql-cassandra:1.1.18"

    // JPA
    implementation          "jakarta.persistence:jakarta.persistence-api:3.2.0"
    implementation          "org.hibernate.orm:hibernate-core:7.4.8.Final"
    implementation          "com.zaxxer:HikariCP:7.1.0"
    implementation          platform("com.fasterxml.jackson:jackson-bom:2.22.2") // To resolve Hibernate using this namespace
    implementation          "tools.jackson.datatype:jackson-datatype-jakarta-jsonp:3.2.2"
    testImplementation      'com.mysql:mysql-connector-j:26.7.0'
    
    // Host metrics
    implementation          "com.github.oshi:oshi-core:7.6.1"
}


// Define test scopes
def testTags = [
    "unit-tests": 'unit-core',
    "integration-tests": 'integration-core',
    "integration-test-rocksdb": 'integration-rocksdb-core',
    "system-tests": 'system-core'
]


// Define logging scope for all tests
tasks.withType(Test).configureEach {
    testLogging {
        showStandardStreams = true
        events "passed", "skipped", "failed", "standardOut", "standardError"
        exceptionFormat "full"
    }
}


// Register test under annotation scheme
testTags.each { name, tag ->
    tasks.register(name, Test) {
        group = 'core-tests'
        description = "Run Parser ${name} tests (${tag})"
        testClassesDirs = sourceSets.test.output.classesDirs
        classpath = sourceSets.test.runtimeClasspath
        useJUnitPlatform {
            includeTags tag
        }
    }
}

jar {
    archiveBaseName.set("tasktide-${project.name}")
    archiveVersion.set(version)
}