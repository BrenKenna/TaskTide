# Root logger level and appenders
log4j2.rootLogger.level = INFO, STDOUT, LOGFILE
log4j2.rootLogger.appenderRef.stdout.ref = STDOUT
log4j2.rootLogger.appenderRef.file.ref = LOGFILE

# Console Appender
log4j2.appender.stdout.type = Console
log4j2.appender.stdout.name = STDOUT
log4j2.appender.stdout.layout.type = PatternLayout
log4j2.appender.stdout.layout.pattern = %d{yyyy-MM-dd HH:mm:ss} %-5p [ %t -> %C.%M ]: %m%n

# File Appender
log4j2.appender.file.type = File
log4j2.appender.file.name = LOGFILE
log4j2.appender.file.fileName = ${sys:projectDir}/TestLog-Core.log
log4j2.appender.file.layout.type = PatternLayout
log4j2.appender.file.layout.pattern = %d{yyyy-MM-dd HH:mm:ss} %-5p [ %t -> %C.%M ]: %m%n

# Logger for specific package/class
log4j2.logger.org.tasktide.level = debug
log4j2.logger.org.tasktide.additivity = false
log4j2.logger.org.tasktide.appenderRefs = stdout
log4j2.logger.org.tasktide.appenderRef.stdout.ref = STDOUT
