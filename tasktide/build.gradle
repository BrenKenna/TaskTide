plugins {
    id 'java'
}

description = 'tasktide'

allprojects {

    group = 'org.tasktide'

    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java'

    dependencies {
        // Jakarta CDI
        implementation 'jakarta.enterprise:jakarta.enterprise.cdi-api:4.1.0'

        // Config
        implementation 'org.eclipse.microprofile.config:microprofile-config-api:2.0'

        // JSON-B (de)Serialization
        implementation 'jakarta.json.bind:jakarta.json.bind-api:2.0.0'
        implementation 'org.eclipse:yasson:3.0.3'

        // Log4J
        implementation 'org.apache.logging.log4j:log4j-api:2.20.0'
        implementation 'org.apache.logging.log4j:log4j-core:2.20.0'

        // Use JUnit Jupiter for testing.
        testImplementation 'org.junit.jupiter:junit-jupiter:5.9.1'
        testImplementation 'org.apache.logging.log4j:log4j-api:2.20.0'
        testImplementation 'org.apache.logging.log4j:log4j-core:2.20.0'
        testImplementation 'org.apache.logging.log4j:log4j-slf4j2-impl:2.20.0'
        testImplementation 'org.jboss.weld:weld-junit5:4.0.3.Final'

        compileOnly 'org.osgi:org.osgi.annotation.bundle:1.0.0'
    }

    tasks.withType(JavaCompile).configureEach {
        options.compilerArgs += ['-Xlint:unchecked']
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()

        reports {
            junitXml.required = true
            html.required = true
        }

        afterSuite { desc, result ->
            if (!desc.parent) {
                println "Test results: file://${buildDir}/reports/tests/test/index.html"
            }
        }
    }
}

project(":itemstore") {}
project(":core") {}
project(":engine") {}
project(":tasktide") {}

task buildAll {
    dependsOn ':itemstore:build', ':core:build', 'engine:build', 'tasktide:build'
}

build.dependsOn buildAll