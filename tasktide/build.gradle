plugins {
    id 'java'
}

description = 'tasktide'
allprojects {
    group = 'org.tasktide'
    version = '0.9.0'
    repositories {
        mavenCentral()
    }
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

subprojects {
    apply plugin: 'java'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(17)
        }
    }

    dependencies {
        // Jakarta CDI
        implementation 'jakarta.enterprise:jakarta.enterprise.cdi-api:4.1.0'
        implementation 'io.smallrye.config:smallrye-config:3.13.2'

        // Config
        implementation 'org.eclipse.microprofile.config:microprofile-config-api:2.0'

        // JSON-B (de)Serialization
        implementation 'jakarta.json.bind:jakarta.json.bind-api:2.0.0'
        implementation 'org.eclipse:yasson:3.0.3'

        // Log4J
        implementation 'org.apache.logging.log4j:log4j-api:2.20.0'
        implementation 'org.apache.logging.log4j:log4j-core:2.20.0'

        // Use JUnit Jupiter for testing.
        testImplementation 'org.junit.jupiter:junit-jupiter:5.9.1'
        testImplementation 'org.apache.logging.log4j:log4j-api:2.20.0'
        testImplementation 'org.apache.logging.log4j:log4j-core:2.20.0'
        testImplementation 'org.apache.logging.log4j:log4j-slf4j2-impl:2.20.0'
        testImplementation 'org.jboss.weld:weld-junit5:4.0.3.Final'
        
        // Mockito
        testImplementation 'org.mockito:mockito-core:5.0.0'
        testImplementation 'org.mockito:mockito-junit-jupiter:5.0.0'
        
        // Unit testing with docker container
        testImplementation 'org.testcontainers:testcontainers:1.21.3'

        compileOnly 'org.osgi:org.osgi.annotation.bundle:1.0.0'
    }

    tasks.withType(JavaCompile).configureEach {
        options.compilerArgs += ['-Xlint:unchecked']
    }

    tasks.withType(Javadoc) {
        options.addStringOption("Xdoclint:none", "-quiet")
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()

        reports {
            junitXml.required = true
            html.required = true
        }

        afterSuite { desc, result ->
            if (!desc.parent) {
                println "Test results: file://${buildDir}/reports/tests/test/index.html"
            }
        }
    }
}


/**
 * Allow list of comma-separated tests to be excluded.
 *   /-> Tests in full class path format
 * 
**/
test {
    def excludes = System.getProperty("exclude.tests")
    if (excludes) {
        excludes.split(",").each { pattern ->
            exclude pattern.trim()
        }
    }
}


// Builds Java doc
tasks.register('generateAllJavadocs', Javadoc) {
    group = 'documentation'
    description = 'Generates Javadocs for all subprojects'

    // Collect source from all subprojects
    source = files(subprojects.collect { it.sourceSets.main.allJava })
    classpath = files(subprojects.collect { it.sourceSets.main.compileClasspath })
    destinationDir = file("$buildDir/docs/javadoc")
    
    options.addStringOption("Xdoclint:none", "-quiet")
}

project(":itemstore") {}
project(":core") {}
project(":engine") {}
project(":tasktide") {}

task buildAll {
    dependsOn ':itemstore:build', ':core:build', 'engine:build', 'tasktide:build'
}

build.dependsOn buildAll