plugins {
    id 'java'
    id 'org.danilopianini.publish-on-central' version '9.2.11' apply false
}

// shared configs
apply from: "$rootDir/gradle/secrets.gradle"
apply from: "$rootDir/gradle/artifacts.gradle"

description = 'tasktide'
allprojects {
    group = "org.tasktide"
    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java'

    dependencies {

        // Jakarta CDI
        implementation 'io.smallrye.config:smallrye-config:3.18.3'
        implementation 'org.eclipse.microprofile.config:microprofile-config-api:3.1.1' // 2.0
        implementation 'jakarta.enterprise:jakarta.enterprise.cdi-api:5.0.0' // 4.1.0 Moved to https://mvnrepository.com/artifact/jakarta.cdi/jakarta.cdi-api
        
        // JSON-B (de)Serialization
        implementation 'org.eclipse.yasson:yasson:3.0.5'
        implementation 'jakarta.json.bind:jakarta.json.bind-api:3.0.3'

        // Log4J: 2.20.1
        implementation platform("org.apache.logging.log4j:log4j-bom:2.26.1")
        implementation 'org.apache.logging.log4j:log4j-api'
        implementation 'org.apache.logging.log4j:log4j-core'
        
        // Arc support
        compileOnly 'org.osgi:org.osgi.annotation.bundle:2.0.0' // 1..0.0

        // Use JUnit Jupiter for testing.
        testImplementation  platform("org.junit:junit-bom:6.1.3") // 5.9.3
        testImplementation  "org.junit.jupiter:junit-jupiter"
        testRuntimeOnly     "org.junit.platform:junit-platform-launcher"
        testImplementation 'org.jboss.weld:weld-junit5:5.0.3.Final'
        
        testImplementation platform("org.apache.logging.log4j:log4j-bom:2.26.1")
        testImplementation 'org.apache.logging.log4j:log4j-api'
        testImplementation 'org.apache.logging.log4j:log4j-core'
        
        // Mockito
        testImplementation platform("org.mockito:mockito-bom:5.23.0")
        testImplementation 'org.mockito:mockito-core' // 5.2.3
        testImplementation 'org.mockito:mockito-junit-jupiter' // 5.0.0
        
        // Unit testing with docker container 1.21.3
        testImplementation platform("org.testcontainers:testcontainers-bom:2.0.5")
        testImplementation 'org.testcontainers:testcontainers'
    }

    tasks.withType(JavaCompile).configureEach {
        options.compilerArgs += ['-Xlint:unchecked']
    }

    tasks.withType(Javadoc) {
        options.addStringOption("Xdoclint:none", "-quiet")
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()

        reports {
            junitXml.required = true
            html.required = true
        }

        afterSuite { desc, result ->
            if (!desc.parent) {
                println "Test results: file://${buildDir}/reports/tests/test/index.html"
            }
        }
    }
}

/**
 * Allow list of comma-separated tests to be excluded.
 *   /-> Tests in full class path format
 * 
**/
test {
    def excludes = System.getProperty("exclude.tests")
    if (excludes) {
        excludes.split(",").each { pattern ->
            exclude pattern.trim()
        }
    }
}

tasks.withType(Test).configureEach {
    maxHeapSize = "4g"
}

// Builds Java doc
tasks.register('generateAllJavadocs', Javadoc) {
    group = 'documentation'
    description = 'Generates Javadocs for all subprojects'

    // Collect source from all subprojects
    source = files(subprojects.collect { it.sourceSets.main.allJava })
    classpath = files(subprojects.collect { it.sourceSets.main.compileClasspath })
    destinationDir = file("$buildDir/docs/javadoc")
    
    options.addStringOption("Xdoclint:none", "-quiet")
}


// Maven publishing modules and aggregated pom
tasks.register('publishTaskTideLocal') {
    group = 'publishing'
    description = 'Publishes TaskTide libraries and aggregator POM to the local Maven repository.'
}


tasks.register('publishTaskTide') {
    group = 'publishing'
    description = 'Publishes TaskTide to Maven Central.'
}


tasks.register('publishLocalTaskTideAggregator') {
    group = 'publishing'
    description = 'Publishes the TaskTide aggregator POM locally'
}

tasks.register('publishTaskTideAggregator') {
    group = 'publishing'
    description = 'Publishes the TaskTide aggregator POM to Maven Central.'

    dependsOn ':tasktide:publishMavenAggregatorPublicationToProjectLocalRepository'
    dependsOn ':tasktide:zipMavenCentralPortalPublication'
    dependsOn ':tasktide:validateMavenCentralPortalPublication'
}


def publishingRequested = gradle.startParameter.taskNames.any {
    it == 'publishTaskTide' ||
    it.endsWith(':publishTaskTide') ||
    it == 'publishTaskTideLocal' ||
    it.endsWith(':publishTaskTideLocal') ||
    it == 'publishTaskTideAggregator' ||
    it.endsWith(':publishTaskTideAggregator') ||
    it == 'publishLocalTaskTideAggregator' ||
    it.endsWith(':publishLocalTaskTideAggregator')
}

if (publishingRequested) {
    apply from: "$rootDir/gradle/launch-publish.gradle"
}


project(":mutex") {}
project(":parser") {}
project(":itemstore") {}
project(":core") {}
project(":engine") {}
project(":api") {}
project(":tasktide") {}

task buildAll {
    dependsOn ':mutex:build',
              ':parser:build',
              ':itemstore:build', 
              ':core:build', 
              ':engine:build',
              ':api:build',
              'tasktide:build'
}

build.dependsOn buildAll
