##########################################################
##########################################################
## 
## 1). TaskTide Global Configurations
## 
##########################################################
##########################################################


# Which client to run
tasktide.client=web-api


# Collection Paramenters
tasktide.core.collection.workflow.name=profiled-workflow
tasktide.core.collection.step.name=Nested NS Lookups
tasktide.core.collection.workitem.name=profiled-work-item


# Repository parameters
tasktide.core.repository.type=nosql
tasktide.core.repository.jnosql.type=document


# Utility parameters
tasktide.utils.date-format=dd/MM/yy HH:mm:ss
tasktide.utils.token-expiration-days=4



##########################################################
##########################################################
## 
## 2). TaskTide Manager Configurations
## 
##########################################################
##########################################################


# Collection Paramenters
tasktide.manager.targetFile=src/test/resources/nested-nslookup-tasks.txt
tasktide.manager.outputFile=src/test/resources/results.txt
tasktide.manager.delimiter=|
tasktide.manager.method=import
tasktide.manager.targetStep=myStep
tasktide.manager.target=WorkItem



##########################################################
##########################################################
## 
## 3). TaskTide Engine Configurations
## 
##########################################################
##########################################################


# Engine execution policy
tasktide.engine.execution-policy=batch


# Task Tide Engine Parameters
tasktide.engine.worker.lock-wait-time=4
tasktide.engine.worker.processor.threads.workitem=3
tasktide.engine.worker.processor.threads.itemtask=3


# Time Keeper Observer
tasktide.engine.observer.timekeeper.level=1
tasktide.engine.observer.timekeeper.onStart.canFail=true
tasktide.engine.observer.timekeeper.onProcessing.canFail=true
tasktide.engine.observer.timekeeper.onPEnd.canFail=true
tasktide.engine.observer.timekeeper.waitTime=1000000



##########################################################
##########################################################
## 
## 4). Jakarta NoSQL 
## 
## Reference Configs GitHub:
##   jnosql-databases.git
##  
##########################################################
##########################################################


# Jakarta NoSQL config
jnosql.document.provider=org.eclipse.jnosql.databases.couchdb.communication.CouchDBDocumentConfiguration
jnosql.document.database=tasktide_database
jnosql.couchdb.host=localhost
jnosql.couchdb.username=admin
jnosql.couchdb.password=password
jnosql.couchdb.port=5984



##########################################################
##########################################################
## 
## 5). Jersey REST-API 
## 
## https://eclipse-ee4j.github.io/jersey/
## https://jakarta.ee/specifications/restful-ws/
## 
##########################################################
##########################################################


# Core
jersey.packages=com.example.api
jersey.config.server.provider.scanning.recursive=true
jersey.config.server.disableAutoDiscovery=false


# HTTP Behavior
jersey.config.server.wadl.disableWadl=true
jersey.config.server.request.buffering=true
jersey.config.server.response.buffering=true


# Tracing & Debugging
jersey.config.server.tracing.type=ON_DEMAND
jersey.config.server.tracing.threshold=SUMMARY
jersey.config.server.monitoring.statistics.enabled=true
jersey.config.server.monitoring.enabled=true


# Async
jersey.config.server.async.support=true
jersey.config.server.async.timeout=30000


# JSON Handling
jersey.config.jsonFeature=jackson
jersey.config.server.disableMoxyJson=true


# CORS
jersey.config.cors.enabled=true
jersey.config.cors.allowOrigin=*
jersey.config.cors.allowHeaders=origin, content-type, accept, authorization
jersey.config.cors.allowMethods=GET,POST,PUT,DELETE,OPTIONS


# Performance
jersey.config.server.entity.maxSize=10485760


# Error Handling
jersey.config.server.error.includeStackTrace=false


##########################################################
##########################################################
## 
## 6). GraphQL 
## 
## https://github.com/eclipse/microprofile-graphql
## https://smallrye.io/smallrye-graphql/
## https://github.com/smallrye/smallrye-graphql
## https://spec.graphql.org/
##  
##########################################################
##########################################################


# Endpoints
smallrye.graphql.path=/graphql
smallrye.graphql.ui.path=/graphql-ui
smallrye.graphql.ui.enable=true


# Schema
smallrye.graphql.schema.strategy=ANNOTATION


# Execution
smallrye.graphql.execution.batchSize=50
smallrye.graphql.execution.timeout=5000


# Errpr handling
smallrye.graphql.errorExtensionFields=exception,classification,description


# Metrics & Observability
smallrye.graphql.metrics.enabled=true
smallrye.graphql.tracing.enabled=true