plugins {
    id 'java'
}

description = 'tasktide:api'
version = providers.gradleProperty('apiVersion').get()

dependencies {

    // Project core lib
    implementation  project(':core')
    implementation  project(':engine')

    // Authentication and Authorization
    implementation      "org.eclipse.microprofile.jwt:microprofile-jwt-auth-api:2.2"
    implementation      "com.nimbusds:nimbus-jose-jwt:10.9.1"
    implementation      "com.nimbusds:oauth2-oidc-sdk:11.38.2"
    implementation      "io.smallrye:smallrye-jwt-cdi-extension:4.6.4"
    implementation      "io.smallrye:smallrye-jwt-build:4.6.4"

    // Web server: platform("org.glassfish.jersey:jersey-bom:3.1.28")
    implementation      platform("org.glassfish.jersey:jersey-bom:4.0.2")
    implementation      "org.glassfish.jersey.inject:jersey-hk2"
    implementation      "org.glassfish.jersey.media:jersey-media-json-binding"
    implementation      "org.glassfish.jersey.containers:jersey-container-servlet"

    testImplementation  "org.glassfish.jersey.test-framework:jersey-test-framework-core"
    testImplementation  "org.glassfish.jersey.test-framework.providers:jersey-test-framework-provider-inmemory"

    // Jetty
    implementation      platform("org.eclipse.jetty:jetty-bom:12.1.13")
    implementation      platform("org.eclipse.jetty.ee10:jetty-ee10-bom:12.1.13")
    implementation      "org.eclipse.jetty:jetty-server"
    implementation      "org.eclipse.jetty.ee10:jetty-ee10-servlet"

    // REST-API
    implementation      "jakarta.ws.rs:jakarta.ws.rs-api:4.0.0"
    implementation      "jakarta.servlet:jakarta.servlet-api:6.1.0"

    // GraphQL: https://www.cve.org/CVERecord?id=CVE-2026-24400 , https://www.cve.org/CVERecord?id=CVE-2022-4065
    // implementation      "org.eclipse.microprofile.graphql:microprofile-graphql-api:2.0"
    // implementation       platform("io.smallrye:smallrye-graphql-bom:2.18.5")
    // implementation      "io.smallrye:smallrye-graphql"
    // implementation      "io.smallrye:smallrye-graphql-api"
    // implementation      "io.smallrye:smallrye-graphql-servlet"

    // Persistence
    testImplementation      "jakarta.nosql:jakarta.nosql-api:1.0.1"
    testImplementation      "jakarta.persistence:jakarta.persistence-api:3.2.0"
    testImplementation      "org.hibernate.orm:hibernate-core:7.4.8.Final"
    testImplementation      "com.zaxxer:HikariCP:7.1.0"

    // To resolve Hibernate using this namespace
    testImplementation      platform("com.fasterxml.jackson:jackson-bom:2.22.2")
    testImplementation      "com.fasterxml.jackson.datatype:jackson-datatype-jakarta-jsonp"

    testImplementation      "org.eclipse.jnosql.mapping:jnosql-mapping-document:1.1.17"
    testImplementation      "org.eclipse.jnosql.mapping:jnosql-mapping-key-value:1.1.17"
    testImplementation      "org.eclipse.jnosql.mapping:jnosql-mapping-column:1.1.17"
    testImplementation      "org.eclipse.jnosql.mapping:jnosql-mapping-graph:1.1.17"
}


// Define test scopes
def testTags = [
    "unit-tests": 'unit-api',
    "integration-tests": 'integration-api',
    "system-tests": 'system-api'
]


tasks.withType(Test).configureEach {
    maxHeapSize = "4g"
}


// Define logging scope for all tests
tasks.withType(Test).configureEach {

    // Ensures that tests operating with shared containers
    //   do not collide on conflicting config requirements
    maxParallelForks = 1
    systemProperty 'junit.jupiter.execution.parallel.enabled', 'false'
    
    testLogging {
        showStandardStreams = true
        events "passed", "skipped", "failed", "standardOut", "standardError"
        exceptionFormat "full"
    }
}

// Register test under annotation scheme
testTags.each { name, tag ->
    tasks.register(name, Test) {
        group = 'api-tests'
        description = "Run Parser ${name} tests (${tag})"
        testClassesDirs = sourceSets.test.output.classesDirs
        classpath = sourceSets.test.runtimeClasspath
        useJUnitPlatform {
            includeTags tag
        }
    }
}


jar {
    archiveBaseName.set("tasktide-${project.name}")
    archiveVersion.set(version)
}