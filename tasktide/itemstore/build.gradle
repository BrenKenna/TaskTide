plugins {
    id 'java'
}

description = 'tasktide:itemstore'
group = 'org.tasktide.itemstore'
version = '0.9.0'

dependencies {

    // SQLite JDBC driver
    implementation 'org.xerial:sqlite-jdbc:3.49.1.0'

    // RocksDB JNI (native bindings)
    implementation 'org.rocksdb:rocksdbjni:10.2.1'

    // Marshaller
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.19.0'
}

jar {
    archiveBaseName.set("tasktide-${project.name}")
    archiveVersion.set(version)
}