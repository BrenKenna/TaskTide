def secretsPropertiesFile = file("$rootDir/.secret/gradle.properties")

if (secretsPropertiesFile.exists()) {
    def secretsProperties = new Properties()

    secretsPropertiesFile.withInputStream {
        secretsProperties.load(it)
    }

    allprojects {
        secretsProperties.each { key, value ->
            project.ext.set(key.toString(), value)
            project.setProperty(key.toString(), value.toString())
        }
    }
}