apply plugin: 'java-library'
apply plugin: 'maven-publish'
apply plugin: 'signing'
apply plugin: 'org.danilopianini.publish-on-central'

java {
    withSourcesJar()
    withJavadocJar()
}

def artifactId = taskTideArtifactIds[project.name]

if (artifactId == null) {
    throw new GradleException(
        "No Maven artifactId configured for project '${project.name}'"
    )
}


publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            artifactId = artifactId
            pom {
                apply from: "$rootDir/gradle/pom.gradle"
            }
        }
    }
}


// GPG Signing
def signingKeyFile = file(
    findProperty('signingKeyFile')
        ?: "$rootDir/.secrets/tasktide-signing-key.asc"
)

def signingPassword = findProperty('signingPassword')

signing {

    if (!signingKeyFile.exists()) {
        throw new GradleException(
            "GPG signing key not found: $signingKeyFile"
        )
    }

    if (!signingPassword) {
        throw new GradleException(
            "GPG signing password has not been configured"
        )
    }

    useInMemoryPgpKeys(
        signingKeyFile.text,
        signingPassword
    )

    sign publishing.publications.mavenJava
}