name: TaskTide-CI Assemble

permissions:
  contents: read

on:
  workflow_call:
  workflow_dispatch:


jobs:
  assemble:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Java 25
      uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
      with:
        java-version: '25'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

    - name: Build TaskTide with Gradle
      run: gradle assemble
      working-directory: tasktide

    - name: Build TaskTide Test Suite with Gradle
      run: gradle testClasses
      working-directory: tasktide