name: TaskTide-CI Assemble

permissions:
  contents: read

on:
  workflow_call:
  workflow_dispatch:


jobs:
  assemble:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb

    - name: Build TaskTide with Gradle
      run: gradle assemble
      working-directory: tasktide