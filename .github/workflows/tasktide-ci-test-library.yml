name: TaskTide-CI Unit, Integration and System Tests

permissions:
  contents: read


on:
  workflow_call:
    inputs:
      library:
        description: "Library to act on"
        required: true
        type: string

  workflow_dispatch:
    inputs:
      library:
        description: "Library to act on"
        required: true
        type: string


jobs:
  library:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: tasktide
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Java 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      
      - name: Run unit tests for ${{ inputs.library }}
        run: |

          # Set test params
          TEST="unit-tests"
          LIBRARY=${{ inputs.library }}

          # Starts MariaDB & couchDB containers for test
          docker container prune -f
          docker container run --rm --name mariadb --detach \
            -e MARIADB_ROOT_PASSWORD=password \
            -e MARIADB_DATABASE=tasktide \
            -p 3306:3306 mariadb:11
          docker container run --rm --name couchdb --detach \
            -e COUCHDB_USER=admin \
            -e COUCHDB_PASSWORD=password \
            -p 5984:5984 couchdb:3.5

          # Kill containers on error
          trap 'docker container kill mariadb couchdb 2>/dev/null || true' EXIT

          # Perform required tests
          ./gradlew :$LIBRARY:$TEST
      

      - name: Run integration tests for ${{ inputs.library }}
        run: |

          # Set test params
          TEST="integration-tests"
          LIBRARY=${{ inputs.library }}

          # Starts MariaDB & couchDB containers for test
          docker container prune -f
          docker container run --rm --name mariadb --detach \
            -e MARIADB_ROOT_PASSWORD=password \
            -e MARIADB_DATABASE=tasktide \
            -p 3306:3306 mariadb:11
          docker container run --rm --name couchdb  --detach \
            -e COUCHDB_USER=admin \
            -e COUCHDB_PASSWORD=password \
            -p 5984:5984 couchdb:3.5

          # Kill containers on error
          trap 'docker container kill mariadb couchdb 2>/dev/null || true' EXIT

          # Perform required tests
          ./gradlew :$LIBRARY:$TEST

      - name: Run system tests for ${{ inputs.library }}
        run: |

          # Set test params
          TEST="system-tests"
          LIBRARY=${{ inputs.library }}

          # Starts MariaDB & couchDB containers for test
          docker container prune -f
          docker container run --rm --name mariadb --detach \
            -e MARIADB_ROOT_PASSWORD=password \
            -e MARIADB_DATABASE=tasktide \
            -p 3306:3306 mariadb:11
          docker container run --rm --name couchdb  --detach \
            -e COUCHDB_USER=admin \
            -e COUCHDB_PASSWORD=password \
            -p 5984:5984 couchdb:3.5

          # Kill containers on error
          trap 'docker container kill mariadb couchdb 2>/dev/null || true' EXIT

          # Perform required tests
          ./gradlew :$LIBRARY:$TEST