name: Publish Documentation

on:
  push:
    paths:
      - "mkdocs.yml"
      - "publish-docs.yml"
  
  workflow_dispatch:


permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install MkDocs
        run: |
          python -m pip install --upgrade pip
          pip install mkdocs-material

      - name: Prepare documentation
        run: |
          # Preserve docs/index.md
          cp docs/index.md /tmp/tasktide-index.md

          # Recreate the MkDocs source tree
          rm -rf docs
          mkdir -p docs

          # Restore landing page
          cp README.md docs/index.md

          # Root documentation
          cp Install.md docs/Install.md
          cp Database-Driver-Installation.md docs/Database-Driver-Installation.md
          cp FAQ.md docs/FAQ.md

          # Module documentation
          mkdir -p docs/tasktide/mutex docs/tasktide/itemstore docs/tasktide/core docs/tasktide/engine docs/tasktide/api docs/tasktide/parser docs/tasktide/tasktide

          cp tasktide/README.md docs/tasktide/README.md
          cp tasktide/mutex/README.md docs/tasktide/mutex/README.md
          cp tasktide/parser/README.md docs/tasktide/parser/README.md
          cp tasktide/itemstore/README.md docs/tasktide/itemstore/README.md
          cp tasktide/core/README.md docs/tasktide/core/README.md
          cp tasktide/engine/README.md docs/tasktide/engine/README.md
          cp tasktide/api/README.md docs/tasktide/api/README.md
          cp tasktide/tasktide/README.md docs/tasktide/tasktide/README.md

          # Use cases
          mkdir -p docs/tasktide/use-cases
          cp -r tasktide/use-cases/* docs/tasktide/use-cases/

          # Assets
          mkdir -p assets
          cp tasktide/docs/assets/*png assets/
          cp tasktide/docs/assets/*jpg assets/

      - name: Build documentation
        run: mkdocs build --strict

      - name: Deploy to GitHub Pages
        run: mkdocs gh-deploy --force