name: TaskTide CI Workflow

permissions:
  contents: read

on:
  workflow_dispatch:

  push:
    branches:
      - main
    
    tags:
       - 'v*.*.*'

    paths:
      - 'tasktide/**'
      - 'docker/**' # So the trial is clear
      - '.github/workflows/**'


  pull_request:
    branches:
      - main

    paths:
      - 'tasktide/**'
      - '.github/workflows/**'
      - 'docker/**' # So the trial is clear


jobs:

  # Assemble main project
  assemble:
    uses: ./.github/workflows/tasktide-ci-assembly.yml


  # Detect libraries to for testing
  detect:
    needs: assemble
    uses: ./.github/workflows/tasktide-ci-detect-updated-module.yml


  # Build and test library strategy matrix
  build:
    needs: detect
    uses: ./.github/workflows/tasktide-ci-test-library.yml
    with:
      library: ${{ matrix.library }}
    if: needs.detect.outputs.libraries != '[]'
    strategy:
      fail-fast: false
      matrix:
        library: ${{ fromJSON(needs.detect.outputs.libraries )}}
  
  
  # Verify docker build
  localDockerVerify:
    runs-on: ubuntu-latest

    needs: build

    steps:

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify docker image builds locally
        run: |

          # Assemble active version
          cd tasktide
          ./gradlew assemble
          mv tasktide/build/distributions/tasktide*.zip ../docker/tasktide.zip

          # Try build
          cd ../docker
          docker image build \
            -t tasktide-local \
            -f tasktide.Dockerfile \
            .

          # Try run
          trap 'docker container kill tasktide-test-img 2>/dev/null || true' EXIT
          docker container run \
            --rm \
            --name "tasktide-test-img" \
            tasktide-local \
              --help