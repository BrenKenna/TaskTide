name: TaskTide-CD Maven Central Publish


permission:
  contents: read


on:
  workflow_dispatch:
  workflow_call:


jobs:
  publishToMavenCentral:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: tasktide

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Determine release version
        id: fetchVersion
        run: |

          # Fetch version from project gradle properties
          VERSION=$( grep "^tasktideVersion" ./gradle.properties | cut -d \= -f 2 )

          # Verify before proceeding
          if [ -z "$VERSION" ]
          then
            echo "No version tag points at this commit."
            exit 1
          else
            echo -e "Proceeding with TaskTide Version $VERSION"
          fi

          # Define env var if present
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"


      - name: Set up JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle


      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0


      - name: Configure artifact signing
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          mkdir -p .secrets
          printf '%s\n' "$GPG_PRIVATE_KEY" > .secrets/tasktide-signing-key.asc
          chmod 600 .secrets/tasktide-signing-key.asc


      - name: Publish to Maven Central
        env:
          MAVEN_CENTRAL_PORTAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_PORTAL_USERNAME}}
          MAVEN_CENTRAL_PORTAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PORTAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingKeyId: ${{ secrets.GPG_KEY_ID }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.GPG_PASSPHRASE }}
          ORG_GRADLE_PROJECT_signingKeyFile: .secrets/tasktide-signing-key.asc
        run: |

          # Verify signing password
          if [ -z "$ORG_GRADLE_PROJECT_signingPassword" ]; then
            echo "GPG signing password is not configured."
            exit 1
          fi

          # Verify signing key Id
          if [ -z "$ORG_GRADLE_PROJECT_signingKeyId" ]; then
            echo "GPG signing key ID is not configured."
            exit 1
          fi

          # Verify signing key file
          if [ ! -f "$ORG_GRADLE_PROJECT_signingKeyFile" ]; then
            echo "GPG signing key file does not exist."
            exit 1
          fi

          # Publish TaskTide and agg pom
          ./gradlew publishTaskTide
          ./gradlew publishTaskTideAggregator
