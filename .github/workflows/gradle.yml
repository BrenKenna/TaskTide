name: Java CI with Gradle

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v[0-9]+'
  pull_request:
    branches: [ "main" ]
  release:
    types: [created]


jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
    - name: Set up Java-17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582

    - name: Build TaskTide With Gradle
      run: gradle build -Dexclude.tests="**/*"
      working-directory: tasktide

    - name: Upload Release Asset
      uses: actions/upload-release-asset@v1
      with:
        upload_url: ${{ github.event.release.upload_url }}
        asset_path: tasktide/build/distributions/tasktide-${{ github.event.release.tag_name }}.zip
        asset_name: tasktide-${{ github.event.release.tag_name }}.zip
        asset_content_type: application/zip

  dependency-submission:

    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # Generates and submits a dependency graph, enabling Dependabot Alerts for all project dependencies.
    # See: https://github.com/gradle/actions/blob/main/dependency-submission/README.md
    - name: Generate and submit dependency graph
      uses: gradle/actions/dependency-submission@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0
      with:
          build-root-directory: tasktide